<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · Brightloop</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="auth-card" style="background:#fff;padding:35px;border:1px solid #e9edf4;border-radius:15px"><div class="brand"><span class="brand-mark">b</span> brightloop</div><span class="eyebrow" style="display:block;margin-top:35px">ACCOUNT SECURITY</span><h2>Set a new password</h2><p class="muted">Choose a strong password to secure your account.</p><form id="reset"><label>New password<input type="password" name="password" minlength="9" required placeholder="Uppercase, lowercase & special character"></label><button class="btn primary full">Update password ↗</button><p id="msg" class="muted"></p></form></section></main><script>document.querySelector('#reset').onsubmit=async e=>{e.preventDefault();let password=new FormData(e.target).get('password');let r=await fetch('/api/reset/{{token}}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});let d=await r.json();document.querySelector('#msg').textContent=r.ok?'Password updated. You can now return to sign in.':d.error; if(r.ok)setTimeout(()=>location.href='/',1500)}</script></body></html>
